<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Instituto</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <!-- Login -->
  <div id="loginSection" class="login-container">
    <h1>🔐 Iniciar Sesión</h1>
    <div id="loginMessage" class="message"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">Usuario</label>
        <input type="text" id="loginUsername" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>
  </div>

  <!-- Panel Principal -->
  <div id="adminPanel" class="hidden">
    <header>
      <div class="container">
        <h1>📊 Panel de Administración</h1>
        <div class="user-info">
          <span id="username">Usuario</span>
          <button id="logoutBtn" class="btn btn-secondary">Cerrar Sesión</button>
        </div>
      </div>
    </header>

    <div class="container">
      <!-- Pestañas -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="news">📰 Noticias</button>
        <button class="tab-btn" data-tab="gallery">🖼️ Galería</button>
      </div>

      <!-- Tab de Noticias -->
      <div id="newsTab" class="tab-content active">
        <div class="form-section">
          <h2>Crear Nueva Noticia</h2>
          <div id="newsMessage" class="message"></div>
          <form id="newsForm">
            <div class="form-group">
              <label for="newsTitle">Título *</label>
              <input type="text" id="newsTitle" required>
            </div>
            <div class="form-group">
              <label for="newsDescription">Descripción *</label>
              <textarea id="newsDescription" required></textarea>
            </div>
            <div class="form-group">
              <label for="newsLink">Enlace (opcional)</label>
              <input type="url" id="newsLink" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="newsImage">Imagen (opcional)</label>
              <input type="file" id="newsImage" accept="image/*">
              <img id="newsImagePreview" class="image-preview" alt="Vista previa">
            </div>
            <button type="submit" class="btn btn-primary">Publicar Noticia</button>
          </form>
        </div>

        <div class="form-section">
          <h2>Noticias Publicadas</h2>
          <div id="newsLoading" class="loading">
            <div class="spinner"></div>
            <p>Cargando noticias...</p>
          </div>
          <div id="newsList" class="items-grid"></div>
        </div>
      </div>

      <!-- Tab de Galería -->
      <div id="galleryTab" class="tab-content">
        <div class="form-section">
          <h2>📸 Subir Foto a Galería</h2>
          <div id="galleryMessage" class="message"></div>
          <form id="galleryForm">
            <div class="form-group">
              <label for="galleryTitle">Título *</label>
              <input type="text" id="galleryTitle" placeholder="Título de la foto" required>
            </div>
            <div class="form-group">
              <label for="galleryDescription">Descripción</label>
              <textarea id="galleryDescription" placeholder="Descripción breve de la foto" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label for="galleryCategory">Categoría *</label>
              <select id="galleryCategory" required>
                <option value="">Selecciona una categoría</option>
                <option value="eventos">Eventos</option>
                <option value="academico">Académico</option>
                <option value="deportes">Deportes</option>
                <option value="cultural">Cultural</option>
                <option value="graduacion">Graduación</option>
                <option value="talleres">Talleres</option>
                <option value="instalaciones">Instalaciones</option>
                <option value="otros">Otros</option>
              </select>
            </div>
            <div class="form-group">
              <label for="galleryImage">Imagen *</label>
              <input type="file" id="galleryImage" accept="image/*" required>
              <img id="galleryImagePreview" class="image-preview" alt="Vista previa">
            </div>
            <button type="submit" class="btn btn-primary">Subir Foto</button>
          </form>
        </div>

        <div class="form-section">
          <h2>🖼️ Fotos de la Galería</h2>
          
          <!-- Filtros y estadísticas -->
          <div class="gallery-stats">
            <div class="stat-card-small">
              <span class="stat-icon">📷</span>
              <div>
                <div class="stat-value" id="totalPhotosCount">0</div>
                <div class="stat-label">Total Fotos</div>
              </div>
            </div>
            <div class="stat-card-small">
              <span class="stat-icon">📁</span>
              <div>
                <div class="stat-value" id="categoriesCount">0</div>
                <div class="stat-label">Categorías</div>
              </div>
            </div>
          </div>

          <!-- Filtros de categoría -->
          <div class="filter-tabs">
            <button class="filter-tab active" data-category="all">Todas</button>
            <button class="filter-tab" data-category="eventos">Eventos</button>
            <button class="filter-tab" data-category="academico">Académico</button>
            <button class="filter-tab" data-category="deportes">Deportes</button>
            <button class="filter-tab" data-category="cultural">Cultural</button>
            <button class="filter-tab" data-category="graduacion">Graduación</button>
            <button class="filter-tab" data-category="talleres">Talleres</button>
            <button class="filter-tab" data-category="instalaciones">Instalaciones</button>
            <button class="filter-tab" data-category="otros">Otros</button>
          </div>

          <!-- Loading -->
          <div id="galleryLoading" class="loading oculto">
            <div class="spinner"></div>
            <p>Cargando galería...</p>
          </div>

          <!-- Lista de fotos -->
          <div id="galleryList" class="items-grid"></div>
          
          <!-- Sin resultados -->
          <div id="noGalleryResults" class="no-results" style="display: none;">
            <p>No hay fotos en esta categoría</p>
          </div>
        </div>
      </div>
    </div>
  </div>

 
  <script src="./script.js"></script>
</body>
</html>
